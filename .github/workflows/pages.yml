# Builds the website (site/), runs the checks and deploys it to GitHub Pages.
# Uses GitHub-hosted runners only. The deploy job needs GitHub Pages to be enabled for this repository
# (Settings > Pages > Source: GitHub Actions); do not enable it before the account restriction is lifted.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'spec/**'
      - 'docs/**'
      - 'schema/**'
      - 'conformance/**'
      - 'CHANGELOG.md'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # Conformance suite: the examples rendered on the site must stay valid.
      - name: Conformance suite
        run: |
          npm ci
          npm test

      - name: Install site dependencies (install scripts disabled by .npmrc)
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Link check (offline)
        working-directory: site
        run: npm run check:links

      - name: Size budget
        working-directory: site
        run: npm run check:budget

      - name: Accessibility check (axe-core, WCAG 2.2 AA, no external requests)
        working-directory: site
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check:a11y

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
